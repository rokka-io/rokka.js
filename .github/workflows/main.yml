name: Main

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [ 18, 20, 22, 24 ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js $${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: npm install and test
        run: |
           npm install
           npm run test
           npm run docs

      # @rollup/plugin-terser 1.x (serialize-javascript 7) needs Node >= 20
      - name: build
        if: matrix.node >= 20
        run: npm run compile


  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: Coverage
        run: npm run coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
